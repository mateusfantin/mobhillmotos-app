# Sobe o site completo na VM da Oracle:
#   caddy (portas 80/443) -> frontend (Node, SSR)  e  /api, /uploads -> backend (Spring Boot)
# O banco é o MySQL HeatWave (fora daqui), acessado pelo IP privado em DB_HOST.
#
# Estrutura esperada na VM:
#   ~/mobhill-motos/API                      (este repositório)
#   ~/mobhill-motos/mob-hill-motos-frontend  (repositório do frontend)
#
# Uso (dentro de API/deploy):  docker compose up -d --build
services:
  backend:
    build: ..
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: ${DDL_AUTO:-validate}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      JAVA_OPTS: -Xms256m -Xmx768m
      TZ: America/Sao_Paulo
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ../../mob-hill-motos-frontend
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8080
      TZ: America/Sao_Paulo
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  uploads:
  caddy_data:
  caddy_config:
