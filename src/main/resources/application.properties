spring.application.name=api

# Configuracoes locais (senhas de desenvolvimento) ficam em API/local.properties,
# que NAO vai para o Git. Em producao tudo vem de variaveis de ambiente (.env do Docker).
spring.config.import=optional:file:./local.properties,optional:file:./API/local.properties

#Banco de dados
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:mobhillproddb}?serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

#Fotos das motos (salvas em disco e servidas em /uploads/**)
app.storage.dir=${UPLOADS_DIR:./uploads}
app.storage.public-path=/uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

#Security - JWT (HS256, segredo com no minimo 32 caracteres). Sem valor padrao de proposito.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration=${JWT_EXPIRATION:7d}

#Primeiro ADMIN, criado no startup se o login ainda nao existir
app.security.admin.name=Administrador
app.security.admin.login=${ADMIN_LOGIN:admin}
app.security.admin.password=${ADMIN_PASSWORD}

#Documentacao da API (Swagger). Desligada em producao via SWAGGER_ENABLED=false
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
